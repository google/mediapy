name: Unittests & Auto-publish

# Allow to trigger the workflow manually (e.g. when deps changes)
on: [push, workflow_dispatch]

permissions: {}

concurrency:
  # concurrency at the workflow level so the multiple matrix don't interfere each others
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel the main branch (to make sure the publish job is never interupted)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.10', '3.x']
        include:
          - python-version: '3.x'
            numpy-version: 'numpy>=2.5.0'

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - run: sudo apt-get update
    - run: sudo apt-get install -y ffmpeg

    # Install deps
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - run: pip --version
    - run: pip install -e .[dev]
    - name: Install numpy>=2.5.0
      if: matrix.numpy-version
      env:
        NUMPY_SPEC: ${{ matrix.numpy-version }}
      run: pip install "${NUMPY_SPEC}"
    - run: pip freeze

    # Run tests (in parallel)
    - name: Run core tests
      run: pytest -vv -n auto

  # Auto-publish when version is increased
  publish-job:
    # Only try to publish if:
    # * Repo is self (prevents running from forks)
    # * Branch is `main`
    if: |
      github.repository == 'google/mediapy'
      && github.ref == 'refs/heads/main'
    needs: pytest-job  # Only publish after tests are successful
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Check version and build if new
      id: check_version
      run: |
        python -m pip install --upgrade pip build 'twine==6.*' packaging
        python -m build
        LOCAL_VER=$(python -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        PYPI_VER=$(python -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/mediapy/json').read())['info']['version'])")
        echo "Local: $LOCAL_VER, PyPI: $PYPI_VER"
        if python -c "from packaging.version import Version; exit(0 if Version('$LOCAL_VER') > Version('$PYPI_VER') else 1)"; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Clean up stale releases from staging repo
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        packages=$(gcloud artifacts packages list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="mediapy--pypi" \
            --format="value(name)")

        echo "${packages}" | xargs -r -n1 sh -c '
            echo "Deleting package: $(basename "$1")..."
            gcloud artifacts packages delete "$1" \
                --project="oss-exit-gate-prod" \
                --location="us" \
                --repository="mediapy--pypi" \
                --quiet
        ' _

    - name: Stage to OSS Exit Gate and upload manifest
      if: steps.check_version.outputs.should_publish == 'true'
      env:
        TWINE_USERNAME: oauth2accesstoken
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        export TWINE_PASSWORD="$(gcloud auth print-access-token)"
        echo "::add-mask::${TWINE_PASSWORD}"
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/mediapy--pypi/" \
          dist/*
        echo '{"publish_all": true}' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/mediapy/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"

    - name: Create GitHub release tag if new version
      if: steps.check_version.outputs.should_publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LOCAL_VER=$(python -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        gh release create "v${LOCAL_VER}" dist/* --title "v${LOCAL_VER}" --generate-notes || true
